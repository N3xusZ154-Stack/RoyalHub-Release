name: Import validated RoyalHub build

on:
  push:
    paths:
      - .github/workflows/import-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download validated obfuscated artifact
        env:
          BUILD_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-4760-820e-9897-1d75bd4e43a0/raw?se=2026-08-13T02%3A57%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=831b280b-fadf-55e3-8b4d-4c34471581b9&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T11%3A45%3A22Z&ske=2026-08-13T11%3A45%3A22Z&sks=b&skv=2026-02-06&sig=nJRWcxhtkTe0I5W7I0dyPLPYl68Z4s92GpZrf8iGc/s%3D"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$BUILD_URL" --output build.zip
          unzip -o build.zip
          test -s RoyalHub.obfuscated.lua
          test "$(wc -c < RoyalHub.obfuscated.lua)" -eq 175180

      - name: Publish obfuscated build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RoyalHub.obfuscated.lua
          if git diff --cached --quiet; then
            echo "Build already up to date"
            exit 0
          fi
          git commit -m "publish validated obfuscated build"
          git push
